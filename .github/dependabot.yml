# Actualizaciones semanales. Las menores y parches de cada ecosistema llegan juntas en un solo PR.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday, timezone: America/Mexico_City }
    open-pull-requests-limit: 5
    groups:
      menores: { update-types: [minor, patch] }

  - package-ecosystem: npm
    directory: /apps/atrium
    schedule: { interval: weekly, day: monday, timezone: America/Mexico_City }
    open-pull-requests-limit: 5
    groups:
      menores: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, timezone: America/Mexico_City }
    groups:
      acciones: { patterns: ["*"] }

  - package-ecosystem: terraform
    directories: [/infra/proyecto, /infra/modulos/medicion]
    schedule: { interval: weekly, day: monday, timezone: America/Mexico_City }
    groups:
      proveedores: { patterns: ["*"] }
