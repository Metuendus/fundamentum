# Workflow reutilizable: terraform fmt y validate sin backend.
#   uses: Metuendus/fundamentum/.github/workflows/terraform.yml@vX.Y.Z
# Corre sin credenciales de nube.
name: terraform

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: "1.9.8"
      directorios:
        description: Módulos a validar, separados por espacio.
        type: string
        default: infra
      fmt-recursivo:
        description: Corre terraform fmt -check -recursive desde la raíz del repo.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.version }}
          terraform_wrapper: false
      - name: Formato
        if: inputs.fmt-recursivo
        run: terraform fmt -check -recursive
      - name: Validar
        env:
          DIRECTORIOS: ${{ inputs.directorios }}
          RECURSIVO: ${{ inputs.fmt-recursivo }}
        run: |
          for dir in $DIRECTORIOS; do
            echo "::group::$dir"
            if [ "$RECURSIVO" != "true" ]; then terraform -chdir="$dir" fmt -check; fi
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
