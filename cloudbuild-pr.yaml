# CI de pull requests. Corre sin credenciales de nube.
steps:
  - id: python
    name: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    entrypoint: bash
    args: ["-ceu", "uv sync --all-packages --frozen && uv run ruff check . && uv run ruff format --check . && uv run pytest -q"]
    waitFor: ["-"]

  - id: terraform
    name: hashicorp/terraform:1.9
    entrypoint: sh
    args:
      - -ceu
      - |
        terraform fmt -check -recursive infra
        for dir in infra/modulos/medicion infra/proyecto; do
          (cd "$$dir" && terraform init -backend=false -input=false && terraform validate)
        done
    waitFor: ["-"]
