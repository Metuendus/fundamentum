[project]
name = "fundamentum-evals"
version = "1.3.0"
description = "Evals comunes sobre adk eval: calidad, y un gate que falla si una versión duplica costo o latencia."
requires-python = ">=3.11,<3.13"
dependencies = ["google-adk[eval]>=2.10,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fundamentum_evals"]
