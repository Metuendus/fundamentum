[project]
name = "fundamentum-adk"
version = "0.1.0"
description = "Plugins y modelos de ADK comunes: medición de costo por llamada, Gemini y Claude en Model Garden."
requires-python = ">=3.12,<3.13"
dependencies = ["fundamentum-modelos", "google-adk>=2.10,<3"]

[project.optional-dependencies]
claude = ["anthropic[vertex]>=0.40"]

[tool.uv.sources]
fundamentum-modelos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fundamentum_adk"]
