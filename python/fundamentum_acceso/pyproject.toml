[project]
name = "fundamentum-acceso"
version = "1.3.0"
description = "Lista de acceso común: quién entra a cada app en beta privada y el portero de Firebase Auth."
requires-python = ">=3.11,<3.13"
dependencies = ["pydantic>=2.9"]

[project.optional-dependencies]
firestore = ["google-cloud-firestore>=2.19"]
firebase = ["firebase-functions>=0.4", "google-cloud-firestore>=2.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fundamentum_acceso"]
